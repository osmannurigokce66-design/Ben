<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - Bas-Konuş & Akıllı Asistan</title>
  
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #050b14;
      color: #00f0ff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hud-container {
      position: relative;
      width: 95vw;
      height: 90vh;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 16px;
      background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      grid-template-rows: 60px 1fr 120px;
      gap: 15px;
      padding: 20px;
    }

    .header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 10px;
    }

    .title {
      font-size: 22px;
      letter-spacing: 3px;
      font-weight: bold;
      text-shadow: 0 0 10px #00f0ff;
    }

    .status-badge {
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 0, 85, 0.2);
      border: 1px solid #ff0055;
      color: #ff0055;
    }

    .status-badge.active {
      background: rgba(0, 255, 136, 0.2);
      border-color: #00ff88;
      color: #00ff88;
    }

    .left-panel {
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
    }

    .metric-box {
      background: rgba(0, 240, 255, 0.05);
      padding: 10px;
      border-left: 3px solid #00f0ff;
    }

    .main-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    #webcamVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
    }

    .arc-reactor {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px dashed #00f0ff;
      animation: rotate 10s linear infinite;
      box-shadow: 0 0 25px #00f0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .arc-inner {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #00f0ff 70%);
      box-shadow: 0 0 30px #00f0ff;
      animation: pulse 2s ease-in-out infinite alternate;
    }

    .arc-reactor.listening {
      border-color: #00ff88;
      box-shadow: 0 0 50px #00ff88;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      from { transform: scale(0.85); opacity: 0.7; }
      to { transform: scale(1.1); opacity: 1; }
    }

    .right-panel {
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
      padding-right: 5px;
    }

    .message {
      padding: 8px 12px;
      border-radius: 6px;
      line-height: 1.4;
    }

    .message.user {
      background: rgba(0, 240, 255, 0.15);
      border-left: 2px solid #00f0ff;
      align-self: flex-end;
    }

    .message.jarvis {
      background: rgba(255, 255, 255, 0.05);
      border-left: 2px solid #00ff88;
      color: #e0e0e0;
    }

    .bottom-panel {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0, 240, 255, 0.2);
      padding-top: 10px;
    }

    .btn-talk {
      background: #00f0ff;
      color: #000;
      border: none;
      padding: 15px 35px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    .btn-talk:active, .btn-talk.active {
      background: #00ff88;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
      transform: scale(0.98);
    }

    .live-caption {
      font-size: 15px;
      color: #00ff88;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="hud-container">
    <div class="header">
      <div class="title">JARVIS // KİŞİSEL ASİSTAN</div>
      <div id="statusBadge" class="status-badge">HAZIR</div>
    </div>

    <div class="left-panel">
      <div class="metric-box">
        <strong>MİKROFON:</strong> <span id="micStatus">Tıklama/SPACE Bekleniyor</span>
      </div>
      <div class="metric-box">
        <strong>KAMERA:</strong> <span id="visualStatus">Devre Dışı</span>
      </div>
      <div class="metric-box">
        <strong>MİMİK ANALİZİ:</strong> <span id="emotionStatus">Bekleniyor...</span>
      </div>
    </div>

    <div class="main-panel">
      <video id="webcamVideo" autoplay muted playsinline></video>
      <div id="arcReactor" class="arc-reactor">
        <div class="arc-inner"></div>
      </div>
    </div>

    <div class="right-panel">
      <div style="font-size: 12px; color: #888; border-bottom: 1px solid #333; padding-bottom: 4px;">DİYALOG LOGLARI</div>
      <div id="chatBox" class="chat-box">
        <div class="message jarvis">Sistem hazır efendim. Konuşmak için butona tıklayın veya SPACE (Boşluk) tuşuna basılı tutun.</div>
      </div>
    </div>

    <div class="bottom-panel">
      <button id="talkBtn" class="btn-talk">KONUŞMAK İÇİN TIKLAYIN (VEYA SPACE TUŞU)</button>
      <div id="liveCaption" class="live-caption">Komut bekleniyor...</div>
    </div>
  </div>

  <script>
    const webcamVideo = document.getElementById('webcamVideo');
    const statusBadge = document.getElementById('statusBadge');
    const micStatus = document.getElementById('micStatus');
    const visualStatus = document.getElementById('visualStatus');
    const emotionStatus = document.getElementById('emotionStatus');
    const chatBox = document.getElementById('chatBox');
    const liveCaption = document.getElementById('liveCaption');
    const arcReactor = document.getElementById('arcReactor');
    const talkBtn = document.getElementById('talkBtn');

    let recognition;
    let isListening = false;
    let userEmotion = "Sakin";

    // Sayfa Açılınca Kamera ve Ses Altyapısını Hazırla
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        webcamVideo.srcObject = stream;
        visualStatus.innerText = "Aktif";
        setupFaceTracking();
      } catch (err) {
        console.warn("Kamera veya mikrofon izinleri verilmedi.");
      }

      setupSpeechRecognition();
    });

    // Ses Tanıma Tanımlaması
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Tarayıcınız ses tanımayı desteklemiyor. Lütfen Google Chrome kullanın.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';
      recognition.interimResults = true;

      recognition.onstart = () => {
        isListening = true;
        arcReactor.classList.add('listening');
        talkBtn.classList.add('active');
        statusBadge.classList.add('active');
        statusBadge.innerText = "DİNLENİYOR...";
        micStatus.innerText = "Ses Alınıyor";
        liveCaption.innerText = "Sizi dinliyorum...";
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        if (interimTranscript.length > 0) {
          liveCaption.innerText = "Duyuluyor: " + interimTranscript;
        }

        if (finalTranscript.trim().length > 0) {
          const text = finalTranscript.trim();
          addMessage(text, 'user');
          processJarvisCommand(text);
        }
      };

      recognition.onend = () => {
        isListening = false;
        arcReactor.classList.remove('listening');
        talkBtn.classList.remove('active');
        statusBadge.classList.remove('active');
        statusBadge.innerText = "HAZIR";
        micStatus.innerText = "Beklemede";
      };

      recognition.onerror = (e) => {
        liveCaption.innerText = "Ses algılanamadı. Tekrar deneyin.";
      };
    }

    // Dinlemeyi Tetikleyen Fonksiyon
    function startListening() {
      if (!isListening && recognition) {
        try {
          recognition.start();
        } catch (e) {
          console.log("Arama zaten aktif.");
        }
      }
    }

    // Butona Basıldığında
    talkBtn.addEventListener('click', () => {
      startListening();
    });

    // Klavyeden SPACE (Boşluk) Tuşuna Basıldığında
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat) {
        e.preventDefault();
        startListening();
      }
    });

    // Cevap Üretici
    function processJarvisCommand(input) {
      const lower = input.toLowerCase();
      let reply = "";

      if (lower.includes("nasılsın") || lower.includes("ne haber")) {
        reply = `Sistemlerim mükemmel çalışıyor efendim. Yüzünüzden ${userEmotion} göründüğünüzü algıladım. Neye ihtiyacınız var?`;
      } else if (lower.includes("kimsin") || lower.includes("jarvis")) {
        reply = "Ben sizin kişisel yapay zeka asistanınız Jarvis'im. Sizi dinliyor, izliyor ve komutlarınızı yerine getiriyorum.";
      } else if (lower.includes("saat kaç") || lower.includes("saat")) {
        const now = new Date();
        reply = `Şu an saat ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}.`;
      } else {
        reply = `Söylediğiniz "${input}" ifadesini kaydettim ve analiz ettim efendim. Size nasıl yardımcı olmamı istersiniz?`;
      }

      addMessage(reply, 'jarvis');
      speakJarvis(reply);
    }

    // Yüz Analizi
    async function setupFaceTracking() {
      try {
        await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
        await faceapi.nets.faceExpressionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');

        setInterval(async () => {
          const detections = await faceapi.detectSingleFace(webcamVideo, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
          if (detections && detections.expressions) {
            const exp = detections.expressions;
            if (exp.happy > 0.5) userEmotion = "Güleryüzlü";
            else if (exp.sad > 0.5) userEmotion = "Üzgün";
            else userEmotion = "Sakin";
            emotionStatus.innerText = userEmotion;
          }
        }, 1000);
      } catch (e) {
        emotionStatus.innerText = "Aktif";
      }
    }

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerText = (sender === 'user' ? 'SİZ: ' : 'JARVIS: ') + text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speakJarvis(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR';
      utterance.rate = 1.0;
      utterance.pitch = 0.95;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
