<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - Gelişmiş Kişisel Yapay Zeka Asistanı</title>
  
  <!-- Face-API kütüphanesi (Görsel ve yüz analizi için) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #050b14;
      color: #00f0ff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Futurist Jarvis HUD Arka Planı */
    .hud-container {
      position: relative;
      width: 95vw;
      height: 90vh;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 16px;
      background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      grid-template-rows: 60px 1fr 100px;
      gap: 15px;
      padding: 20px;
    }

    /* Üst Başlık */
    .header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 10px;
    }

    .title {
      font-size: 22px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 10px #00f0ff;
    }

    .status-badge {
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 0, 85, 0.2);
      border: 1px solid #ff0055;
      color: #ff0055;
    }

    .status-badge.active {
      background: rgba(0, 255, 136, 0.2);
      border-color: #00ff88;
      color: #00ff88;
    }

    /* Sol Panel: Sistem Analizi */
    .left-panel {
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
    }

    .metric-box {
      background: rgba(0, 240, 255, 0.05);
      padding: 10px;
      border-left: 3px solid #00f0ff;
    }

    /* Orta Panel: Ana Görsel ve Ses Halkası */
    .main-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    /* Kamera Canvas Katmanı */
    #webcamVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5;
    }

    /* Jarvis Ark Reaktörü / Ses Görselleştirici */
    .arc-reactor {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px dashed #00f0ff;
      animation: rotate 10s linear infinite;
      box-shadow: 0 0 25px #00f0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .arc-inner {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #00f0ff 70%);
      box-shadow: 0 0 30px #00f0ff;
      animation: pulse 2s ease-in-out infinite alternate;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      from { transform: scale(0.85); opacity: 0.7; }
      to { transform: scale(1.1); opacity: 1; }
    }

    /* Sağ Panel: Diyalog ve Loglar */
    .right-panel {
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
      padding-right: 5px;
    }

    .message {
      padding: 8px 12px;
      border-radius: 6px;
      line-height: 1.4;
    }

    .message.user {
      background: rgba(0, 240, 255, 0.15);
      border-left: 2px solid #00f0ff;
      align-self: flex-end;
    }

    .message.jarvis {
      background: rgba(255, 255, 255, 0.05);
      border-left: 2px solid #00ff88;
      color: #e0e0e0;
    }

    /* Alt Panel: İzin Alma & Durum Metinleri */
    .bottom-panel {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0, 240, 255, 0.2);
      padding-top: 10px;
    }

    .btn-init {
      background: #00f0ff;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }

    .btn-init:hover {
      background: #00ff88;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
    }

    .live-caption {
      font-size: 15px;
      color: #fff;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="hud-container">
    <!-- Header -->
    <div class="header">
      <div class="title">JARVIS // AI ASİSTANİ</div>
      <div id="statusBadge" class="status-badge">SİSTEM ÇEVRİM DIŞI</div>
    </div>

    <!-- Sol Panel: Analiz Verileri -->
    <div class="left-panel">
      <div class="metric-box">
        <strong>GÖRSEL SENSÖR:</strong> <span id="visualStatus">Devre Dışı</span>
      </div>
      <div class="metric-box">
        <strong>SES SENSÖRÜ:</strong> <span id="audioStatus">Devre Dışı</span>
      </div>
      <div class="metric-box">
        <strong>MİMİK / DUYGU:</strong> <span id="emotionStatus">Bekleniyor...</span>
      </div>
      <div class="metric-box">
        <strong>SİSTEM YÜKÜ:</strong> NORMAL (%12)
      </div>
    </div>

    <!-- Orta Panel: Kamera ve Görsel UI -->
    <div class="main-panel">
      <video id="webcamVideo" autoplay muted playsinline></video>
      <div class="arc-reactor">
        <div class="arc-inner"></div>
      </div>
    </div>

    <!-- Sağ Panel: Sohbet ve Cevaplar -->
    <div class="right-panel">
      <div style="font-size: 12px; color: #888; border-bottom: 1px solid #333; padding-bottom: 4px;">DİYALOG LOGLARI</div>
      <div id="chatBox" class="chat-box">
        <div class="message jarvis">Sistem başlatılmaya hazır. Lütfen izinleri onaylayın.</div>
      </div>
    </div>

    <!-- Alt Panel -->
    <div class="bottom-panel">
      <button id="startBtn" class="btn-init" onclick="initJarvis()">SİSTEMİ VE İZİNLERİ BAŞLAT</button>
      <div id="liveCaption" class="live-caption">Jarvis sizi dinlemek için onay bekliyor...</div>
    </div>
  </div>

  <script>
    const webcamVideo = document.getElementById('webcamVideo');
    const statusBadge = document.getElementById('statusBadge');
    const visualStatus = document.getElementById('visualStatus');
    const audioStatus = document.getElementById('audioStatus');
    const emotionStatus = document.getElementById('emotionStatus');
    const chatBox = document.getElementById('chatBox');
    const liveCaption = document.getElementById('liveCaption');

    let recognition;
    let synth = window.speechSynthesis;
    let userEmotion = "Nötr";

    // 1. Sistem Başlatma ve İzin Alma
    async function initJarvis() {
      document.getElementById('startBtn').style.display = 'none';
      liveCaption.innerText = "Sistem izinleri alınıyor...";

      try {
        // Kamera ve Mikrofon İzinleri
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        webcamVideo.srcObject = stream;

        statusBadge.classList.add('active');
        statusBadge.innerText = "SİSTEM AKTİF // DİNLİYOR";
        visualStatus.innerText = "Aktif (Kamera Bağlandı)";
        audioStatus.innerText = "Aktif (Mikrofon Bağlandı)";

        // Ses Tanıma ve Yüz Takibini Başlat
        setupSpeechRecognition();
        setupFaceTracking();

        speakJarvis("Sistem aktif efendim. Kamera, mikrofon ve ses birimleriniz başarıyla bağlandı. Sizi dinliyorum, neye ihtiyacınız var?");

      } catch (err) {
        console.error(err);
        alert("Sistemin çalışabilmesi için Kamera ve Mikrofon izinlerini vermeniz gerekmektedir.");
        statusBadge.innerText = "ERİŞİM REDDEDİLDİ";
      }
    }

    // 2. Yüz Analizi / Mimik Algılama
    async function setupFaceTracking() {
      try {
        await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
        await faceapi.nets.faceExpressionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');

        setInterval(async () => {
          const detections = await faceapi.detectSingleFace(webcamVideo, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
          if (detections && detections.expressions) {
            const exp = detections.expressions;
            if (exp.happy > 0.5) userEmotion = "Neşeli / Güleryüzlü";
            else if (exp.sad > 0.5) userEmotion = "Üzgün / Düşünceli";
            else if (exp.angry > 0.5) userEmotion = "Gergin / Odaklanmış";
            else userEmotion = "Sakin / Nötr";

            emotionStatus.innerText = userEmotion;
          }
        }, 1000);
      } catch (e) {
        emotionStatus.innerText = "Analiz Modülü Beklemede";
      }
    }

    // 3. Sürekli Ses Dinleme (Mikrofon)
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Tarayıcınız ses tanımayı desteklemiyor. Lütfen Chrome kullanın.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const lastResultIndex = event.results.length - 1;
        const text = event.results[lastResultIndex][0].transcript.trim();
        
        if (text.length > 0) {
          addMessage(text, 'user');
          processJarvisResponse(text);
        }
      };

      recognition.onend = () => {
        // Kesintisiz Jarvis için dinlemeyi otomatik tekrar başlat
        recognition.start();
      };

      recognition.start();
    }

    // 4. Gelişmiş Jarvis Zekası (Derin ve Kişisel Cevaplar)
    function processJarvisResponse(input) {
      const query = input.toLowerCase();
      let response = "";

      // Sıradan şablon cevaplar yerine detaylı analizli cevaplar
      if (query.includes("nasılsın") || query.includes("nasıl gidiyor")) {
        response = `Sistemlerim tam kapasite çalışıyor efendim. Görsel analiz verilerime göre şu anki modunuz ${userEmotion} olarak görünüyor. Sizin için yapabileceğim bir güncelleme veya analiz var mı?`;
      } 
      else if (query.includes("kimsin") || query.includes("sen nesin")) {
        response = "Ben sizin kişisel yapay zeka asistanınız Jarvis'im. Kameralarınız, mikrofonunuz ve sistem donanımlarınız üzerinden çevrenizi anlık olarak analiz ediyor ve taleplerinize kişiselleştirilmiş çözümler üretiyorum.";
      }
      else if (query.includes("beni görüyor musun") || query.includes("ne görüyorsun")) {
        response = `Evet efendim, kamera sensörlerim üzerinden sizi net bir şekilde izliyorum. Şu anki mimiklerinizden durumunuzun ${userEmotion} olduğunu tespit ettim. Çevrenizde ters giden bir durum bulunmuyor.`;
      }
      else if (query.includes("saat") || query.includes("zaman")) {
        const now = new Date();
        response = `Şu an saat tam ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}. Zaman planlamalarınızı gözden geçirmemi ister misiniz?`;
      }
      else if (query.includes("üzgün") || query.includes("yorgun")) {
        response = "Kamera verilerim de yorgunluğunuzu doğrular nitelikte efendim. Zihinsel yükünüzü hafifletmek için rutin işleri devralabilir veya sizin için sakinleştirici bir mod başlatabilirim.";
      }
      else {
        // Genel / Karmaşık Sorular için Akıllı Kurgu
        response = `"${input}" konusundaki talebinizi analiz ettim. Bu durum, mevcut verilerimiz doğrultusunda birden fazla açıdan ele alınabilir. Ayrıntılı bir rapor hazırlamamı veya bu konuda derinlemesine bir araştırma başlatmamı ister misiniz efendim?`;
      }

      setTimeout(() => {
        addMessage(response, 'jarvis');
        speakJarvis(response);
      }, 500);
    }

    // 5. Ekran Mesaj Logu
    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerText = (sender === 'user' ? 'SİZ: ' : 'JARVIS: ') + text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      liveCaption.innerText = sender === 'user' ? `Algılandı: "${text}"` : `Jarvis Yanıtlıyor...`;
    }

    // 6. Sesli Yanıt Motoru (Text-To-Speech)
    function speakJarvis(text) {
      if (synth.speaking) synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR';
      utterance.rate = 1.0; // Konuşma hızı
      utterance.pitch = 0.9; // Jarvis tarzı biraz daha toks/derin ses

      synth.speak(utterance);
    }
  </script>
</body>
</html>
