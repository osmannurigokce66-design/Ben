<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - Canlı Ses Takipli Yapay Zeka</title>
  
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #050b14;
      color: #00f0ff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hud-container {
      position: relative;
      width: 95vw;
      height: 90vh;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 16px;
      background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
      display: grid;
      grid-template-columns: 300px 1fr 340px;
      grid-template-rows: 60px 1fr 100px;
      gap: 15px;
      padding: 20px;
    }

    .header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 10px;
    }

    .title {
      font-size: 22px;
      letter-spacing: 3px;
      font-weight: bold;
      text-shadow: 0 0 10px #00f0ff;
    }

    .status-badge {
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 0, 85, 0.2);
      border: 1px solid #ff0055;
      color: #ff0055;
    }

    .status-badge.active {
      background: rgba(0, 255, 136, 0.2);
      border-color: #00ff88;
      color: #00ff88;
    }

    .left-panel {
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
    }

    .metric-box {
      background: rgba(0, 240, 255, 0.05);
      padding: 10px;
      border-left: 3px solid #00f0ff;
    }

    .main-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    #webcamVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
    }

    .arc-reactor {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px dashed #00f0ff;
      animation: rotate 10s linear infinite;
      box-shadow: 0 0 25px #00f0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .arc-inner {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #00f0ff 70%);
      box-shadow: 0 0 30px #00f0ff;
      animation: pulse 2s ease-in-out infinite alternate;
    }

    .arc-reactor.listening {
      border-color: #00ff88;
      box-shadow: 0 0 40px #00ff88;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      from { transform: scale(0.85); opacity: 0.7; }
      to { transform: scale(1.1); opacity: 1; }
    }

    .right-panel {
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
      padding-right: 5px;
    }

    .message {
      padding: 8px 12px;
      border-radius: 6px;
      line-height: 1.4;
    }

    .message.user {
      background: rgba(0, 240, 255, 0.15);
      border-left: 2px solid #00f0ff;
      align-self: flex-end;
    }

    .message.jarvis {
      background: rgba(255, 255, 255, 0.05);
      border-left: 2px solid #00ff88;
      color: #e0e0e0;
    }

    .bottom-panel {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0, 240, 255, 0.2);
      padding-top: 10px;
    }

    .btn-init {
      background: #00f0ff;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .live-caption {
      font-size: 15px;
      color: #00ff88;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="hud-container">
    <div class="header">
      <div class="title">JARVIS // KESİNTİSİZ SESLİ ASİSTAN</div>
      <div id="statusBadge" class="status-badge">MİKROFON KAPALI</div>
    </div>

    <div class="left-panel">
      <div class="metric-box">
        <strong>MİKROFON DURUMU:</strong> <span id="micStatus">Devre Dışı</span>
      </div>
      <div class="metric-box">
        <strong>KAMERA:</strong> <span id="visualStatus">Devre Dışı</span>
      </div>
      <div class="metric-box">
        <strong>DUYGU ANALİZİ:</strong> <span id="emotionStatus">Bekleniyor...</span>
      </div>
    </div>

    <div class="main-panel">
      <video id="webcamVideo" autoplay muted playsinline></video>
      <div id="arcReactor" class="arc-reactor">
        <div class="arc-inner"></div>
      </div>
    </div>

    <div class="right-panel">
      <div style="font-size: 12px; color: #888; border-bottom: 1px solid #333; padding-bottom: 4px;">ANLIK SES DİYALOGLARI</div>
      <div id="chatBox" class="chat-box">
        <div class="message jarvis">Başlamak için aşağıdaki butona basın ve mikrofona izin verin.</div>
      </div>
    </div>

    <div class="bottom-panel">
      <button id="startBtn" class="btn-init" onclick="initJarvis()">DİNLEMEYİ VE SİSTEMİ BAŞLAT</button>
      <div id="liveCaption" class="live-caption">"Jarvis" demenizi bekliyor...</div>
    </div>
  </div>

  <script>
    const webcamVideo = document.getElementById('webcamVideo');
    const statusBadge = document.getElementById('statusBadge');
    const micStatus = document.getElementById('micStatus');
    const visualStatus = document.getElementById('visualStatus');
    const emotionStatus = document.getElementById('emotionStatus');
    const chatBox = document.getElementById('chatBox');
    const liveCaption = document.getElementById('liveCaption');
    const arcReactor = document.getElementById('arcReactor');

    let recognition;
    let isListening = false;
    let userEmotion = "Sakin";

    async function initJarvis() {
      document.getElementById('startBtn').style.display = 'none';

      try {
        // Kamera Erişimi
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        webcamVideo.srcObject = stream;
        visualStatus.innerText = "Aktif";

        // Ses Tanımayı Başlat
        startContinuousSpeechRecognition();
        setupFaceTracking();

        statusBadge.classList.add('active');
        statusBadge.innerText = "CANLI DİNLENİYOR";
        micStatus.innerText = "Sürekli Aktif (7/24)";

        speakJarvis("Sistem aktif efendim. Sizi anlık olarak dinliyorum, 'Jarvis' dediğiniz an emrinizdeyim.");

      } catch (err) {
        console.error(err);
        alert("Kamera ve mikrofon erişimine izin vermelisiniz.");
      }
    }

    // Kesintisiz Sürekli Dinleme Motoru
    function startContinuousSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Tarayıcınız Web Speech API'yi desteklemiyor. Lütfen Google Chrome kullanın.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = true;
      recognition.interimResults = true; // Konuşurken anlık algılasın

      recognition.onstart = () => {
        isListening = true;
        arcReactor.classList.add('listening');
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        // Anlık ne duyuyorsa ekranda göster
        if (interimTranscript.length > 0) {
          liveCaption.innerText = "Duyuluyor: " + interimTranscript;
        }

        // Cümle tamamlandığında işle
        if (finalTranscript.trim().length > 0) {
          const text = finalTranscript.trim();
          addMessage(text, 'user');
          liveCaption.innerText = "İşleniyor...";
          processJarvisCommand(text);
        }
      };

      // Mikrofon Sessizlikten Kapandığı An OTOMATİK TEKRAR AÇ
      recognition.onend = () => {
        isListening = false;
        arcReactor.classList.remove('listening');
        // Kesintisiz arka plan dinlemesi için 300ms sonra tekrar başlat
        setTimeout(() => {
          try {
            recognition.start();
          } catch (e) {
            console.log("Tekrar başlatılıyor...");
          }
        }, 300);
      };

      recognition.onerror = (event) => {
        console.warn("Ses tanıma uyarısı:", event.error);
      };

      recognition.start();
    }

    // Komut İşleme ve Tetikleyici (Wake Word)
    function processJarvisCommand(input) {
      const lower = input.toLowerCase();
      let reply = "";

      // 'Jarvis' kelimesi veya doğrudan soru sorulduğunda tepki ver
      if (lower.includes("jarvis") || lower.includes("yarvis") || lower.includes("servis")) {
        if (lower.includes("nasılsın") || lower.includes("ne haber")) {
          reply = `Sizi duymakta hiçbir sorun yaşamıyorum efendim. Yüz ifadenizden ${userEmotion} göründüğünüzü tespit ettim. Nasıl yardımcı olabilirim?`;
        } else if (lower.includes("duyuyor musun") || lower.includes("beni duyuyor musun")) {
          reply = "Sizi net bir şekilde duyuyorum efendim. Mikrofon ve canlı analiz birimlerim aktif durumda.";
        } else if (lower.includes("saat kaç") || lower.includes("saat")) {
          const now = new Date();
          reply = `Şu an saat ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}.`;
        } else {
          reply = `Buyurun efendim, sizi dinliyorum. "${input}" ile ilgili talebinizi hemen işliyorum.`;
        }
      } else {
        // Eğer Jarvis demeden doğrudan bir şey sorulduysa da anlık yanıtla
        reply = `Sizi dinliyorum efendim. Sorunuz: "${input}". Cevabım: Tüm tarayıcı sistemlerim anlık olarak cümlenizi işledi ve yanıt hazırlandı.`;
      }

      addMessage(reply, 'jarvis');
      speakJarvis(reply);
    }

    // Yüz Analizi
    async function setupFaceTracking() {
      try {
        await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
        await faceapi.nets.faceExpressionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');

        setInterval(async () => {
          const detections = await faceapi.detectSingleFace(webcamVideo, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
          if (detections && detections.expressions) {
            const exp = detections.expressions;
            if (exp.happy > 0.5) userEmotion = "Güleryüzlü";
            else if (exp.sad > 0.5) userEmotion = "Üzgün";
            else userEmotion = "Sakin / Odaklanmış";
            emotionStatus.innerText = userEmotion;
          }
        }, 1000);
      } catch (e) {
        emotionStatus.innerText = "Aktif";
      }
    }

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerText = (sender === 'user' ? 'SİZ: ' : 'JARVIS: ') + text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speakJarvis(text) {
      window.speechSynthesis.cancel(); // Önceki konuşmayı kes
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR';
      utterance.rate = 1.0;
      utterance.pitch = 0.95;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
